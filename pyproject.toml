[project]
name = "open-data-llm"
version = "0.1.0"
description = "RAG over the Bratislava open data portal (DCAT + ArcGIS Hub)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]
rerank = [
    "sentence-transformers>=3.0",
]
mlx = [
    "mlx-lm>=0.20",
    "hf_transfer>=0.1.8",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
mcp = [
    "mcp>=1.0",
]

[project.scripts]
bdata = "opendata_llm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opendata_llm"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "mcp.*", "mlx_lm.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer uses function calls as argument defaults by design.
"src/opendata_llm/cli.py" = ["B008"]
